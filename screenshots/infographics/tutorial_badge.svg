<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <!-- Translate everything by 33,33 to add padding matching F-Droid -->
  <g transform="translate(33, 33)">
    <!-- Background -->
    <rect x="0" y="0" width="454" height="134" rx="20" fill="#000000" stroke="#777777" stroke-width="4"/>
    
    <!-- Icon: Web Demo -->
    <g transform="translate(27, 22)">
      <rect x="0" y="0" width="90" height="90" rx="15" fill="#7F52FF" />
      <rect x="10" y="10" width="70" height="20" rx="5" fill="#000000" opacity="0.3" />
      <polygon points="35,35 35,75 65,55" fill="#FFFFFF"/>
    </g>

    <!-- Text -->
    <text x="142" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="1" fill="#CCCCCC">INTERACTIVE</text>
    <text x="137" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="-1" fill="#FFFFFF">Web Demo</text>
  </g>
</svg>
