<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="460" height="140">
  <!-- Background -->
  <rect x="3" y="3" width="454" height="134" rx="20" fill="#000000" stroke="#777777" stroke-width="4"/>
  
  <!-- Icon: Globe / Web -->
  <g transform="translate(30, 25)">
    <!-- A stylized browser window / web icon -->
    <rect x="0" y="0" width="90" height="90" rx="15" fill="#7F52FF" />
    <!-- Browser top bar -->
    <rect x="10" y="10" width="70" height="20" rx="5" fill="#000000" opacity="0.3" />
    <!-- Content area with a play triangle to indicate "interactive" -->
    <polygon points="35,35 35,75 65,55" fill="#FFFFFF"/>
  </g>

  <!-- Text -->
  <text x="145" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="1" fill="#CCCCCC">INTERACTIVE</text>
  <text x="140" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="-1" fill="#FFFFFF">Web Demo</text>
</svg>
